<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrackMyBus – Live Bus Tracking</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    /* Background image with blur (same as other pages) */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("assets/bus.png");
      background-size: cover;
      background-position: center;
      filter: blur(8px);
      transform: scale(1.08);
      z-index: 0;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 8px;
    }

    p.subtitle {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card {
      width: 260px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .card p {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 18px;
    }

    .card button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #2b7cff;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .footer {
      margin-top: 40px;
      font-size: 13px;
      opacity: 0.8;
    }
  </style>
</head>

<body>
  <div class="page">
    <h1>🚍 Live Bus Tracking</h1>
    <p class="subtitle">Know where your bus is – in real time</p>

    <div class="cards">
      <!-- Driver Card -->
      <div class="card">
        <h3>🧑‍✈️ Driver</h3>
        <p>Login to update bus location, arrival time, seats, and status.</p>
        <button onclick="window.location.href='login.html'">
          Login as Driver
        </button>
      </div>

      <!-- Passenger Card -->
      <div class="card">
        <h3>👥 Passenger</h3>
        <p>View live bus status, route, seats, and ask AI for updates.</p>
        <button onclick="window.location.href='index.html'">
          Continue as Passenger
        </button>
      </div>
    </div>

    <div class="footer">
      Powered by Firebase & Google Technologies
    </div>
  </div>
</body>
</html>
