<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrackMyBus – Passenger</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("assets/bus.png");
      background-size: cover;
      background-position: center;
      filter: blur(8px);
      transform: scale(1.08);
      z-index: 0;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .card {
      width: 460px;
      max-width: 95%;
      padding: 28px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(18px);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    h2 {
      text-align: center;
      margin-bottom: 18px;
    }

    .info {
      margin: 10px 0;
      font-size: 15px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 13px;
      margin-left: 6px;
    }

    .on-time { background: #22c55e; }
    .delayed { background: #facc15; color: #000; }
    .full { background: #ef4444; }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      background: #2b7cff;
      color: #fff;
      cursor: pointer;
      font-size: 14px;
    }

    .updated {
      margin-top: 12px;
      font-size: 13px;
      text-align: right;
      font-style: italic;
    }

    .ai-box {
      margin-top: 18px;
    }

    .ai-box input {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: none;
      margin-bottom: 8px;
    }

    .ai-answer {
      font-size: 13px;
      margin-top: 6px;
      opacity: 0.95;
    }

    .offline {
      margin-top: 10px;
      color: #ffd1d1;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <h2>🚍 TrackMyBus – Passenger</h2>

      <div class="info">Route: <span id="route">-</span></div>
      <div class="info">Current Stop: <span id="stop">-</span></div>
      <div class="info">Arrival Time: <span id="time">-</span></div>
      <div class="info">Seats Available: <span id="seats">-</span></div>

      <div class="info">
        Status:
        <span id="statusBadge" class="badge">-</span>
      </div>

      <button id="refreshBtn">🔄 Refresh Live Status</button>

      <div class="updated" id="lastUpdated">Last updated: -</div>
      <div class="offline" id="offlineMsg"></div>

      <!-- AI Section -->
      <div class="ai-box">
        <h3>🤖 Ask TrackMyBus AI</h3>
        <input id="aiQuestion" placeholder="Ask about bus status..." />
        <button onclick="askAI()">Ask AI</button>
        <div class="ai-answer" id="aiAnswer"></div>
      </div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="./firebase/firebase-config.js"></script>
  <script src="passenger.js"></script>
</body>
</html>
