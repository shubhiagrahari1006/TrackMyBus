<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TrackMyBus – Driver Panel</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      position: relative;
      overflow: hidden;
      color: #fff;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("assets/bus.png");
      background-size: cover;
      background-position: center;
      filter: blur(8px);
      transform: scale(1.08);
      z-index: 0;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    .card {
      width: 420px;
      max-width: 95%;
      padding: 26px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(18px);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    }

    h2 {
      text-align: center;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-top: 12px;
      font-size: 14px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      margin-top: 4px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #2b7cff;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .status {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
      color: #a7ffb0;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <h2>🧑‍✈️ Driver Panel</h2>

      <label>Route</label>
      <input id="routeInput" value="Mumbai – Delhi" />

      <label>Current Stop</label>
      <select id="stopSelect">
        <option>Mumbai</option>
        <option>Surat</option>
        <option>Vadodara</option>
        <option>Delhi</option>
      </select>

      <label>Arrival Time</label>
      <input id="timeInput" type="time" />

      <label>Available Seats</label>
      <input id="seatsInput" type="number" value="35" />

      <label>Status</label>
      <select id="statusSelect">
        <option>On Time</option>
        <option>Delayed</option>
        <option>Full</option>
      </select>

      <button onclick="updateBus()">Update Bus Status</button>

      <div class="status" id="statusMsg"></div>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="./firebase/firebase-config.js"></script>

  <script>
    function updateBus() {
      const route = document.getElementById("routeInput").value;
      const stop = document.getElementById("stopSelect").value;
      const time = document.getElementById("timeInput").value;
      const seats = Number(document.getElementById("seatsInput").value);
      const status = document.getElementById("statusSelect").value;

      database.ref("bus/bus1").update({
        route: route,
        currentStop: stop,
        arrivalTime: time,
        seats: seats,
        status: status,
        lastUpdated: Date.now()
      });

      document.getElementById("statusMsg").innerText =
        "✅ Bus information updated successfully";
    }
  </script>
</body>
</html>
